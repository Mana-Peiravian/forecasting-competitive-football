name: Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "api/**"
      - "docs/**"
      - "outputs/final_evaluation/**"
      - "outputs/figures/**"
      - "outputs/features/**"
      - "outputs/snapshots/**"
      - "report/final_report.pdf"
      - "scripts/build_docs_data.py"
      - "scripts/check_docs.py"
      - "scripts/export_openapi.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_configured: ${{ steps.configure_pages.outcome == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build static results and replay data
        run: python scripts/build_docs_data.py

      - name: Generate and verify OpenAPI
        run: |
          python scripts/export_openapi.py
          python scripts/export_openapi.py --check

      - name: Build MkDocs in strict mode
        run: mkdocs build --strict

      - name: Validate built links and API assets
        run: python scripts/check_docs.py

      - name: Configure GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        if: steps.configure_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: needs.build.outputs.pages_configured == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
