<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swagger UI · Forecasting Competitive Football</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; background: #f6f8fa; font-family: system-ui, sans-serif; }
    .notice { padding: .9rem 1.2rem; border-bottom: 1px solid #e2b24b; background: #fff8e1; color: #342c1c; }
    .notice a { color: #00695c; font-weight: 700; }
  </style>
</head>
<body>
  <div class="notice">
    This is static API documentation. “Try it out” targets the configured server in the schema—localhost by default—and works only while the FastAPI backend is running or after a public backend URL is configured.
    <a href="../quickstart/">Start the API locally</a> · <a href="../../">Return to the site</a>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "../openapi.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      displayRequestDuration: true,
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
      layout: "BaseLayout"
    });
  </script>
</body>
</html>
